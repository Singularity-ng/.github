name: Reusable Rust Release with Attestations

# Organization-wide reusable workflow for Rust releases
# Includes automatic artifact attestations (SLSA Build Level 2)
# Usage: Call from your repo's release workflow

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string
      rust-toolchain:
        description: 'Rust toolchain version'
        required: false
        type: string
        default: 'stable'
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: 'crates.io token (optional)'
        required: false

permissions:
  contents: write
  id-token: write  # Required for attestations
  attestations: write

jobs:
  build-and-attest:
    name: Build Crate with Attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Build crate package
        run: |
          cargo package --all-features
          mkdir -p release-artifacts
          cp target/package/*.crate release-artifacts/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-artifacts/*.crate'

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum *.crate > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: release-artifacts/

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../binary-${{ matrix.target }}.tar.gz *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path * -DestinationPath ../../../binary-${{ matrix.target }}.zip

      - name: Attest (Unix)
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'binary-${{ matrix.target }}.tar.gz'

      - name: Attest (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'binary-${{ matrix.target }}.zip'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
